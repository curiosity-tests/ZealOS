name: Build ZealOS ISOs
run-name: "Build ZealOS ISOs ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '**/LICENSE'
  pull_request:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '**/LICENSE'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential git xorriso qemu-system-x86

      - name: Enable KVM Group Perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ISOs Build Script
        timeout-minutes: 10
        if: ${{ success() }}
        run: |
          cd build
          ./build-iso.sh --headless
          cd ..

      - name: ISO Check
        if: ${{ success() && hashFiles('./build/*.iso') == '' }}
        run: |
          echo "ISOs not built!"
          exit 1

      - name: Releasing Latest ISOs
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        if: ${{ success() && github.event_name == 'push'}}
        uses: "GutPuncher/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Pre-Built ISOs [${{ github.sha }}]"
          files: ./build/*.iso

      - name: OK
        if: ${{ success() }}
        run: |
          echo "Build OK"
